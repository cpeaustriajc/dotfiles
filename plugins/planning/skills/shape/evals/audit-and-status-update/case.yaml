name: audit-and-status-update
expected_outcome: |
  The audit flags the status narration, future tense and next steps in the description and
  proposes an evergreen rewrite with dated progress moved to the update. The status update uses
  Health, Progress, Risks and Next, proposes a health that reflects the item blocked on another
  team (not on track just because most items are done), and asks the lead to confirm it.
